name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/ocr-perspective-delete-v02
      - feature/ocr-anchor-v03

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestigationManager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

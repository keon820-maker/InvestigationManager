name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public repository safety check
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -Ei '(^|/)(local\.properties|keystore\.properties|google-services\.json)$|\.(jks|keystore|p12|pfx|apk|aab)$' || true)
          if [ -n "$bad" ]; then
            echo "Sensitive/build artifact files must not be committed:"
            echo "$bad"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${SIGNING_KEYSTORE_BASE64:?Missing SIGNING_KEYSTORE_BASE64 repository secret}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD repository secret}"

          KEYSTORE_PATH="$RUNNER_TEMP/InvestigationManager-release.keystore"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias investigationmanager >/dev/null

          KEY_HASH=$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias investigationmanager | openssl sha1 -binary | openssl base64 -A)
          if [ "$KEY_HASH" != 'axBO/Il7LuxDRi9BOYgOPopVbus=' ]; then
            echo "The signing certificate does not match the Kakao key hash."
            exit 1
          fi

          echo "SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Prepare Firebase configuration
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "Firebase configuration not supplied; cloud sync will be disabled in this build."
            exit 0
          fi

          CONFIG_PATH="$RUNNER_TEMP/firebase-google-services.json"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$CONFIG_PATH"
          jq -e --arg package 'kr.co.investigation.manager' \
            '.client[] | select(.client_info.android_client_info.package_name == $package)' \
            "$CONFIG_PATH" >/dev/null

          FIREBASE_PROJECT_ID=$(jq -er '.project_info.project_id' "$CONFIG_PATH")
          FIREBASE_STORAGE_BUCKET=$(jq -er '.project_info.storage_bucket' "$CONFIG_PATH")
          FIREBASE_APP_ID=$(jq -er --arg package 'kr.co.investigation.manager' \
            '.client[] | select(.client_info.android_client_info.package_name == $package) | .client_info.mobilesdk_app_id' \
            "$CONFIG_PATH" | head -n 1)
          FIREBASE_API_KEY=$(jq -er --arg package 'kr.co.investigation.manager' \
            '.client[] | select(.client_info.android_client_info.package_name == $package) | .api_key[0].current_key' \
            "$CONFIG_PATH" | head -n 1)
          FIREBASE_WEB_CLIENT_ID=$(jq -er --arg package 'kr.co.investigation.manager' \
            '.client[] | select(.client_info.android_client_info.package_name == $package) | .oauth_client[] | select(.client_type == 3) | .client_id' \
            "$CONFIG_PATH" | head -n 1)

          {
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET"
            echo "FIREBASE_APP_ID=$FIREBASE_APP_ID"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_WEB_CLIENT_ID=$FIREBASE_WEB_CLIENT_ID"
          } >> "$GITHUB_ENV"

      - name: Build permanently signed Debug APK
        shell: bash
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KAKAO_NATIVE_APP_KEY:?Missing KAKAO_NATIVE_APP_KEY repository secret}"
          gradle testDebugUnitTest assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)
          EXPECTED_SHA256='4a8e4dcbabe21943c0377c2bec150d5d98f70a4ec8d74a35b11fe7382d7984dd'
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "APK was not signed with the permanent InvestigationManager key."
            exit 1
          fi

      - name: Prepare versioned APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Unable to read versionName from app/build.gradle.kts"
            exit 1
          fi
          APK_NAME="InvestigationManager-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: InvestigationManager-v${{ steps.version.outputs.version }}-debug-apk
          path: ${{ steps.version.outputs.apk_name }}
          retention-days: 14

      - name: Publish GitHub Release APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          APK="${{ steps.version.outputs.apk_name }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "InvestigationManager $TAG" \
              --generate-notes
          fi

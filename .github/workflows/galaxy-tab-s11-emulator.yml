name: Galaxy Tab S11 Emulator

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: galaxy-tab-s11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tablet-smoke-test:
    name: Android 16 / 2560x1600
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reject private image fixtures
        shell: bash
        run: |
          set -euo pipefail
          private_images=$(git ls-files 'app/src/test/**' 'app/src/androidTest/**' | grep -Ei '\.(jpe?g|png|heic|webp)$' || true)
          if [ -n "$private_images" ]; then
            echo "OCR tests must generate non-personal images at runtime; committed image fixtures are forbidden."
            exit 1
          fi

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and exercise app on tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_c
          cores: 4
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          script: bash .github/scripts/tablet-smoke.sh

      - name: Upload tablet test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-tab-s11-emulator-evidence
          path: tablet-test-artifacts
          if-no-files-found: warn
          retention-days: 14
